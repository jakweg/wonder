on:
  push:
    branches: ["master"]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        run: docker compose up --build
        env:
          DIST: /tmp/wonder-dist
          DEV: false
          SERVE:
        working-directory: "encytem"
      - name: Prepare and clean for public deployment
        run: cp -r /tmp/wonder-dist /tmp/for-public && rm /tmp/for-public/.*
      - name: Copy Cloudflare configuration
        run: cp ./encytem/cloudflare_headers.txt /tmp/for-public/_headers
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy /tmp/for-public --project-name=${{ secrets.PROJECT_NAME }}
